name: Simple refinery product customer collection

on:
  schedule:
    # Daily quota-conscious collection; manual dispatch remains available for an extra batch.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      market:
        description: "Market to collect"
        required: true
        type: choice
        options:
          - Iran + Iraq
          - Iran
          - Iraq
          - Global
        default: Iran + Iraq
      target_new_leads:
        description: "Maximum new companies to add in this batch (repeat runs deduplicate)"
        required: true
        type: choice
        options:
          - "100"
          - "250"
          - "500"
        default: "500"
      seed_urls:
        description: "Optional public company URLs, one per line (automatic discovery also runs)"
        required: false
        type: string
      max_pages_per_company:
        description: "Same-site pages to inspect per company"
        required: true
        type: choice
        options:
          - "3"
          - "5"
        default: "3"

permissions:
  contents: read

concurrency:
  group: simple-refinery-customer-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve run settings
        shell: bash
        env:
          INPUT_MARKET: ${{ inputs.market }}
          INPUT_TARGET: ${{ inputs.target_new_leads }}
          INPUT_SEEDS: ${{ inputs.seed_urls }}
        run: |
          set -euo pipefail
          echo "MARKET=${INPUT_MARKET:-Iran + Iraq}" >> "$GITHUB_ENV"
          echo "TARGET_NEW=${INPUT_TARGET:-500}" >> "$GITHUB_ENV"
          printf '%s\n' "${INPUT_SEEDS:-}" > manual_seeds.txt

      - name: Validate Sheets connection
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_SHEETS_API_URL" || -z "$GOOGLE_SHEETS_API_TOKEN" ]]; then
            echo "Missing Google Sheets bridge secrets."
            exit 1
          fi

      - name: Discover public company websites
        run: |
          set -euo pipefail
          python scripts/discover_tehran_refinery_buyers.py --limit 300 --output discovered_seeds.txt --social-output social_buyer_evidence.csv
          if [[ "$MARKET" == "Iran + Iraq" ]]; then
            python scripts/discover_osm_refinery_buyers.py --market Iran --limit 500 --output osm_iran_seeds.txt --evidence osm_iran_evidence.csv
            python scripts/discover_osm_refinery_buyers.py --market Iraq --limit 500 --output osm_iraq_seeds.txt --evidence osm_iraq_evidence.csv
            cat osm_iran_seeds.txt osm_iraq_seeds.txt > osm_seeds.txt
            { head -n 1 osm_iran_evidence.csv; tail -n +2 osm_iran_evidence.csv; tail -n +2 osm_iraq_evidence.csv; } > osm_buyer_evidence.csv
          else
            python scripts/discover_osm_refinery_buyers.py --market "$MARKET" --limit 500 --output osm_seeds.txt --evidence osm_buyer_evidence.csv
          fi
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, urldefrag
          ordered, seen_urls, seen_domains = [], set(), set()
          for name in ("manual_seeds.txt", "discovered_seeds.txt", "osm_seeds.txt"):
              path = Path(name)
              if not path.exists():
                  continue
              for raw in path.read_text(encoding="utf-8").splitlines():
                  url = raw.strip()
                  if not url or url.startswith("#"):
                      continue
                  parsed = urlsplit(url)
                  if parsed.scheme not in ("http", "https") or not parsed.hostname:
                      continue
                  domain = parsed.hostname.lower().removeprefix("www.")
                  key = urldefrag(url)[0].rstrip("/").lower()
                  if key in seen_urls or domain in seen_domains:
                      continue
                  seen_urls.add(key)
                  seen_domains.add(domain)
                  ordered.append(url)
          Path("diesel_seeds.txt").write_text("\n".join(ordered) + ("\n" if ordered else ""), encoding="utf-8")
          print(f"SEED_LIST_READY unique_company_domains={len(ordered)}")
          PY
          echo "DISCOVERED_SEED_URLS=$(grep -Ec '^https?://' diesel_seeds.txt || true)"

      - name: Collect and deduplicate company records
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python diesel_leads/collector.py --seeds diesel_seeds.txt --market "$MARKET" --max-pages "${{ inputs.max_pages_per_company || '3' }}" --max-domains 250 --max-seconds 3000 --target-new "$TARGET_NEW" --output diesel_leads.jsonl

      - name: Add matching public OSM contacts
        run: python scripts/enrich_leads_from_osm.py diesel_leads.jsonl osm_buyer_evidence.csv

      - name: Save new leads and refresh existing companies in Google Sheets
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python -m pip install requests
          python scripts/export_diesel_buyers_to_sheets.py diesel_leads.jsonl

      - name: Send buyer report to Telegram (optional secrets)
        if: always() && steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_buyer_leads_telegram.py diesel_leads.jsonl

      # This workflow is collection-only. It never sends email or WhatsApp.

      - name: Upload customer collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refinery-customer-collection
          path: |
            discovered_seeds.txt
            osm_seeds.txt
            social_buyer_evidence.csv
            osm_buyer_evidence.csv
            osm_iran_evidence.csv
            osm_iraq_evidence.csv
            diesel_seeds.txt
            diesel_leads.jsonl
          if-no-files-found: ignore
          retention-days: 14
