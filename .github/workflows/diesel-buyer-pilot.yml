name: Rojan Global — multi-product buyer research (collection only)

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market priority"
        required: true
        type: choice
        options:
          - Worldwide
          - Africa
          - Asia
          - Middle East
          - China
        default: Africa
      priority:
        description: "Select the fastest-to-follow-up campaign"
        required: true
        type: choice
        options:
          - "Fast buyer signals (recommended)"
          - "Fuel and petroleum buyers"
          - "Chemicals and petrochemicals"
          - "Automation and instrumentation"
          - "All catalog categories"
        default: "Fast buyer signals (recommended)"
      seed_urls:
        description: "Public procurement/company sources, one URL per line (editable)"
        required: true
        type: string
        default: |-
          https://dangoteeastafrica.co.ke/
          https://www.pbpa.go.tz/
          https://www.totalenergies.ug/projects/tilenga/national-content/tenders
          https://www.etenders.gov.za/
          https://www.erwat.co.za/
          https://www.johannesburgwater.co.za/
          https://www.sibanyestillwater.com/suppliers/south-africa/procurement-contacts/
          https://www.yokogawa.com/mea/industries/oil-gas/
      max_pages_per_company:
        description: "Small first batch for faster feedback; 3 recommended"
        required: true
        type: choice
        options:
          - "3"
          - "5"
          - "8"
        default: "3"

permissions:
  contents: read

concurrency:
  group: diesel-buyer-pilot
  cancel-in-progress: false

jobs:
  collect_only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Google Sheets configuration and seed list
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          SEED_URLS: ${{ inputs.seed_urls }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SHEETS_API_URL}" || -z "${GOOGLE_SHEETS_API_TOKEN}" ]]; then
            echo "Missing Google Sheets bridge secrets."
            exit 1
          fi
          printf '%s\\n' "${SEED_URLS}" > diesel_seeds.txt
          if ! grep -Eq '^https?://' diesel_seeds.txt; then
            echo "No valid http(s) seed URL was supplied."
            exit 1
          fi

      - name: Qualify discovered signals (triage only)
        run: |
          python -m py_compile diesel_leads/signal_qualifier.py
          python diesel_leads/signal_qualifier.py \
            --input public_buyer_signals.jsonl \
            --output qualified_buyer_signals.jsonl

      - name: Read existing Leads and collect multi-product buyer evidence
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          CAMPAIGN_PRIORITY: ${{ inputs.priority }}
        shell: bash
        run: |
          case "$CAMPAIGN_PRIORITY" in
            "Fuel and petroleum buyers") PRIORITY=fuel_buyers ;;
            "Chemicals and petrochemicals") PRIORITY=chemicals ;;
            "Automation and instrumentation") PRIORITY=automation_instrumentation ;;
            "All catalog categories") PRIORITY=all_catalog ;;
            *) PRIORITY=fast_buying_signals ;;
          esac
          python diesel_leads/collector.py \\
            --seeds diesel_seeds.txt \\
            --market "${{ inputs.market }}" \\
            --max-pages "${{ inputs.max_pages_per_company }}" \\
            --priority "$PRIORITY" \\
            --output diesel_leads.jsonl

      - name: Verify source pages and extract buyer evidence (review-only)
        run: |
          python -m py_compile diesel_leads/verify_buyer_evidence.py
          python diesel_leads/verify_buyer_evidence.py \
            --input diesel_leads.jsonl \
            --output buyer_evidence_verification.jsonl \
            --max-sources 3

      - name: Merge new evidence into existing Leads rows
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python -m pip install requests
          python scripts/export_diesel_buyers_to_sheets.py diesel_leads.jsonl

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diesel-buyer-collection-report
          path: |
            diesel_leads.jsonl
            diesel_seeds.txt
            buyer_evidence_verification.jsonl
          if-no-files-found: ignore
          retention-days: 14
