name: Afghanistan multi-fuel buyer research and consent-gated outreach

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market for this manual batch"
        required: true
        type: choice
        options:
          - Afghanistan
        default: Afghanistan
      target_new_leads:
        description: "Maximum genuinely new company records for this run"
        required: true
        type: choice
        options:
          - "10"
          - "20"
          - "30"
        default: "10"
      seed_urls:
        description: "Optional extra public company URLs, one per line (automatic discovery runs too)"
        required: false
        type: string
      max_pages_per_company:
        description: "Maximum same-site pages to inspect per discovered company"
        required: true
        type: choice
        options:
          - "3"
          - "5"
        default: "3"
      send_email:
        description: "Enable email channel; only explicitly eligible contacts can receive (20/day max)"
        required: true
        type: boolean
        default: true
      send_whatsapp:
        description: "Enable WhatsApp channel; only explicit opt-ins can receive (5/day max)"
        required: true
        type: boolean
        default: true
      dry_run:
        description: "Safety mode: report eligible contacts only; no messages are sent"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: afghanistan-multifuel-research-manual
  cancel-in-progress: false

jobs:
  collect_only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve market and batch target
        shell: bash
        env:
          INPUT_MARKET: ${{ inputs.market }}
          INPUT_TARGET: ${{ inputs.target_new_leads }}
        run: |
          set -euo pipefail
          MARKET="${INPUT_MARKET:-Egypt}"
          TARGET_NEW="${INPUT_TARGET:-10}"
          echo "MARKET=$MARKET" >> "$GITHUB_ENV"
          echo "TARGET_NEW=$TARGET_NEW" >> "$GITHUB_ENV"
          echo "Manual batch market=$MARKET target_new=$TARGET_NEW"
      - name: Validate Google Sheets configuration
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          MANUAL_SEEDS: ${{ inputs.seed_urls }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SHEETS_API_URL}" || -z "${GOOGLE_SHEETS_API_TOKEN}" ]]; then
            echo "Missing Google Sheets bridge secrets."
            exit 1
          fi
          printf '%s\n' "${MANUAL_SEEDS:-}" > manual_seeds.txt
          : > diesel_seeds.txt

      - name: Restore cached OpenStreetMap company website seeds
        uses: actions/cache@v4
        with:
          path: |
            .cache/osm_seeds_Afghanistan.txt
            .cache/osm_seed_domains.txt
          key: osm-seeds-v1-${{ github.run_id }}
          restore-keys: |
            osm-seeds-v1-

      - name: Discover fresh company websites from public web search
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install osmium
          python scripts/discover_diesel_buyer_sites.py --market "$MARKET" --limit 120 --output discovered_seeds.txt
          python scripts/discover_osm_industrial_sites.py --market "$MARKET" --output osm_seeds.txt --cache-file ".cache/osm_seeds_$MARKET.txt" --max-age-days 7
          # Preserve relevance order: manual URLs, web discoveries, then OSM.
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, urldefrag
          ordered, seen_urls, seen_domains = [], set(), set()
          for name in ("manual_seeds.txt", "discovered_seeds.txt", "osm_seeds.txt"):
              path = Path(name)
              if not path.exists():
                  continue
              for raw in path.read_text(encoding="utf-8").splitlines():
                  url = raw.strip()
                  if not url or url.startswith("#"):
                      continue
                  parsed = urlsplit(url)
                  if parsed.scheme not in ("http", "https") or not parsed.hostname:
                      continue
                  domain = parsed.hostname.lower().removeprefix("www.")
                  key = urldefrag(url)[0].rstrip("/").lower()
                  if key in seen_urls or domain in seen_domains:
                      continue
                  seen_urls.add(key)
                  seen_domains.add(domain)
                  ordered.append(url)
          Path("diesel_seeds.txt").write_text("\n".join(ordered) + ("\n" if ordered else ""), encoding="utf-8")
          print(f"SEED_PRIORITY_ORDER manual_search_osm unique_domains={len(ordered)}")
          PY
          echo "DISCOVERED_SEED_URLS=$(grep -c '^https\?://' diesel_seeds.txt || true)"

      - name: Read existing Leads and collect genuinely new companies
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python diesel_leads/collector.py --seeds diesel_seeds.txt --market "$MARKET" --max-pages "${{ inputs.max_pages_per_company || '3' }}" --max-domains 60 --max-seconds 1500 --target-new "$TARGET_NEW" --output diesel_leads.jsonl

      - name: Merge new evidence into existing Leads rows
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python -m pip install requests
          python scripts/export_diesel_buyers_to_sheets.py diesel_leads.jsonl

      - name: Send only when manually selected (dry-run by default)
        if: github.event_name == 'workflow_dispatch' && (inputs.send_email || inputs.send_whatsapp)
        env:
          SEND_EMAIL: ${{ inputs.send_email }}
          SEND_WHATSAPP: ${{ inputs.send_whatsapp }}
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WUAPI_API_KEY: ${{ secrets.WUAPI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "$DRY_RUN" == "true" ]]; then ARGS+=(--dry-run); fi
          if [[ "$SEND_EMAIL" == "true" ]]; then ARGS+=(--email); fi
          if [[ "$SEND_WHATSAPP" == "true" ]]; then ARGS+=(--whatsapp); fi
          python scripts/send_diesel_outreach.py "${ARGS[@]}"

      - name: Upload discovery and collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afghanistan-multifuel-research-report
          path: |
            discovered_seeds.txt
            osm_seeds.txt
            diesel_seeds.txt
            diesel_leads.jsonl
          if-no-files-found: ignore
          retention-days: 14
