name: Diesel buyer research and outreach

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market priority for this batch"
        required: true
        type: choice
        options:
          - China
          - Africa
        default: China
      seed_urls:
        description: "Public company or industry-directory URLs, one per line"
        required: true
        type: string
      max_pages_per_company:
        description: "Maximum same-site pages to inspect per URL"
        required: true
        type: choice
        options:
          - "3"
          - "5"
          - "8"
        default: "5"
      outreach_mode:
        description: "Draft outreach, or send one qualified business email (daily cap 3)"
        required: true
        type: choice
        options:
          - draft
          - send
        default: draft

permissions:
  contents: read

concurrency:
  group: diesel-buyer-pilot
  cancel-in-progress: false

jobs:
  collect_and_outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exporter dependency
        run: python -m pip install requests

      - name: Validate configuration and prepare seed list
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          SEED_URLS: ${{ inputs.seed_urls }}
          OUTREACH_MODE: ${{ inputs.outreach_mode }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SHEETS_API_URL}" || -z "${GOOGLE_SHEETS_API_TOKEN}" ]]; then
            echo "Missing Google Sheets bridge secrets."
            exit 1
          fi
          printf '%s\\n' "${SEED_URLS}" > diesel_seeds.txt
          if ! grep -Eq '^https?://' diesel_seeds.txt; then
            echo "No valid http(s) seed URL was supplied."
            exit 1
          fi
          if [[ "${OUTREACH_MODE}" == "send" ]]; then
            test -n "${GMAIL_USERNAME}" || { echo "Missing GMAIL_USERNAME repository secret."; exit 1; }
            test -n "${GMAIL_APP_PASSWORD}" || { echo "Missing GMAIL_APP_PASSWORD repository secret."; exit 1; }
          fi

      - name: Read existing Leads and collect public company evidence
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python diesel_leads/collector.py \\
            --seeds diesel_seeds.txt \\
            --market "${{ inputs.market }}" \\
            --max-pages "${{ inputs.max_pages_per_company }}" \\
            --output diesel_leads.jsonl

      - name: Merge new evidence into existing Leads rows
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: python scripts/export_diesel_buyers_to_sheets.py diesel_leads.jsonl

      - name: Prepare or send qualified buyer outreach
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python scripts/diesel_outreach.py diesel_leads.jsonl \\
            --mode "${{ inputs.outreach_mode }}" \\
            --max-per-run 1 \\
            --max-per-day 3
