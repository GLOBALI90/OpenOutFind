name: Diesel buyer research (fresh web discovery, collection only)

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 11 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      market:
        description: "Market for this manual batch"
        required: true
        type: choice
        options:
          - China
          - Africa
        default: China
      target_new_leads:
        description: "Maximum genuinely new company records for this run"
        required: true
        type: choice
        options:
          - "10"
          - "20"
          - "30"
        default: "10"
      seed_urls:
        description: "Optional extra public company URLs, one per line (automatic discovery runs too)"
        required: false
        type: string
      max_pages_per_company:
        description: "Maximum same-site pages to inspect per discovered company"
        required: true
        type: choice
        options:
          - "5"
          - "7"
        default: "5"
      send_email:
        description: "Send approved B2B emails (20/day max; requires email_outreach_eligible=TRUE)"
        required: true
        type: boolean
        default: false
      send_whatsapp:
        description: "Send WhatsApp only to recorded opt-ins (5/day max; requires whatsapp_opt_in=TRUE)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: diesel-buyer-research
  cancel-in-progress: false

jobs:
  collect_only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve market and batch target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          INPUT_MARKET: ${{ inputs.market }}
          INPUT_TARGET: ${{ inputs.target_new_leads }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE_EXPR" in
              "17 3 * * *"|"17 11 * * *") MARKET="China" ;;
              "17 19 * * *") MARKET="Africa" ;;
              *) echo "Unknown schedule slot: $SCHEDULE_EXPR"; exit 1 ;;
            esac
            TARGET_NEW="10"
          else
            MARKET="$INPUT_MARKET"
            TARGET_NEW="${INPUT_TARGET:-10}"
          fi
          echo "MARKET=$MARKET" >> "$GITHUB_ENV"
          echo "TARGET_NEW=$TARGET_NEW" >> "$GITHUB_ENV"
          echo "Batch market=$MARKET target_new=$TARGET_NEW"

      - name: Validate Google Sheets configuration
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          MANUAL_SEEDS: ${{ inputs.seed_urls }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SHEETS_API_URL}" || -z "${GOOGLE_SHEETS_API_TOKEN}" ]]; then
            echo "Missing Google Sheets bridge secrets."
            exit 1
          fi
          printf '%s\n' "${MANUAL_SEEDS:-}" > manual_seeds.txt
          : > diesel_seeds.txt

      - name: Restore previously checked website domains
        uses: actions/cache@v4
        with:
          path: .cache/diesel_checked_domains_v2.txt
          key: diesel-buyer-checked-v2-${{ github.run_id }}
          restore-keys: |
            diesel-buyer-checked-v2-


      - name: Restore cached OpenStreetMap company website seeds
        uses: actions/cache@v4
        with:
          path: |
            .cache/osm_seeds_China.txt
            .cache/osm_seeds_Africa.txt
            .cache/osm_seed_domains.txt
          key: osm-seeds-v1-${{ github.run_id }}
          restore-keys: |
            osm-seeds-v1-

      - name: Discover fresh company websites from public web search
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install osmium
          python scripts/discover_diesel_buyer_sites.py --market "$MARKET" --limit 120 --output discovered_seeds.txt
          python scripts/discover_osm_industrial_sites.py --market "$MARKET" --output osm_seeds.txt --cache-file ".cache/osm_seeds_$MARKET.txt" --max-age-days 7
          if [[ -s discovered_seeds.txt ]]; then
            cat discovered_seeds.txt >> diesel_seeds.txt
          fi
          if [[ -s osm_seeds.txt ]]; then
            cat osm_seeds.txt >> diesel_seeds.txt
          fi
          if [[ -s manual_seeds.txt ]]; then
            cat manual_seeds.txt >> diesel_seeds.txt
          fi
          sort -u diesel_seeds.txt -o diesel_seeds.txt
          echo "DISCOVERED_SEED_URLS=$(grep -c '^https\?://' diesel_seeds.txt || true)"

      - name: Read existing Leads and collect genuinely new companies
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python diesel_leads/collector.py --seeds diesel_seeds.txt --market "$MARKET" --max-pages "${{ inputs.max_pages_per_company || '5' }}" --target-new "$TARGET_NEW" --output diesel_leads.jsonl

      - name: Merge new evidence into existing Leads rows
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python -m pip install requests
          python scripts/export_diesel_buyers_to_sheets.py diesel_leads.jsonl

      - name: Send approved outreach (manual runs only)
        if: github.event_name == 'workflow_dispatch' && (inputs.send_email || inputs.send_whatsapp)
        env:
          SEND_EMAIL: ${{ inputs.send_email }}
          SEND_WHATSAPP: ${{ inputs.send_whatsapp }}
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WUAPI_API_KEY: ${{ secrets.WUAPI_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "$SEND_EMAIL" == "true" ]]; then ARGS+=(--email); fi
          if [[ "$SEND_WHATSAPP" == "true" ]]; then ARGS+=(--whatsapp); fi
          python scripts/send_diesel_outreach.py "${ARGS[@]}"

      - name: Upload discovery and collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diesel-buyer-research-report
          path: |
            discovered_seeds.txt
            osm_seeds.txt
            diesel_seeds.txt
            diesel_leads.jsonl
          if-no-files-found: ignore
          retention-days: 14
