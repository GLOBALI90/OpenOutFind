name: Diesel buyer research (collection-only pilot)

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market priority for this batch"
        required: true
        type: choice
        options:
          - China
          - Africa
        default: China
      seed_urls:
        description: "Public company or industry-directory URLs, one per line"
        required: true
        type: string
      max_pages_per_company:
        description: "Maximum same-site pages to inspect per URL"
        required: true
        type: choice
        options:
          - "3"
          - "5"
          - "8"
        default: "5"

permissions:
  contents: read

concurrency:
  group: diesel-buyer-pilot
  cancel-in-progress: false

jobs:
  collect_only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Google Sheets configuration and seed list
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
          SEED_URLS: ${{ inputs.seed_urls }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SHEETS_API_URL}" || -z "${GOOGLE_SHEETS_API_TOKEN}" ]]; then
            echo "Missing Google Sheets bridge secrets."
            exit 1
          fi
          printf '%s\\n' "${SEED_URLS}" > diesel_seeds.txt
          if ! grep -Eq '^https?://' diesel_seeds.txt; then
            echo "No valid http(s) seed URL was supplied."
            exit 1
          fi

      - name: Read existing Leads and collect public company evidence
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python diesel_leads/collector.py \\
            --seeds diesel_seeds.txt \\
            --market "${{ inputs.market }}" \\
            --max-pages "${{ inputs.max_pages_per_company }}" \\
            --output diesel_leads.jsonl

      - name: Merge new evidence into existing Leads rows
        env:
          GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
          GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
        run: |
          python -m pip install requests
          python scripts/export_diesel_buyers_to_sheets.py diesel_leads.jsonl

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diesel-buyer-collection-report
          path: |
            diesel_leads.jsonl
            diesel_seeds.txt
          if-no-files-found: ignore
          retention-days: 14
