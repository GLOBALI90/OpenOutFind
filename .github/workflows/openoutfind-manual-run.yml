name: OpenOutFind — Manual lead collection

on:
  workflow_dispatch:
    inputs:
      product_docs:
        description: "Describe the product, its uses, and the companies that buy it"
        required: true
        type: string
      campaign_target:
        description: "Target buyer profile and market, including country"
        required: true
        type: string
      lead_count:
        description: "Number of additional qualified leads to find (small first run)"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "5"
        default: "3"

permissions:
  contents: read

concurrency:
  group: openoutfind-manual-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENOUTFIND_DB: .state/openoutfind.sqlite3
      OPENOUTFIND_PRODUCT_DOCS: ${{ inputs.product_docs }}
      OPENOUTFIND_CAMPAIGN_TARGET: ${{ inputs.campaign_target }}
      OPENOUTFIND_AI_MODEL: ${{ vars.OPENOUTFIND_AI_MODEL || 'google:gemini-2.5-flash' }}
      OPENOUTFIND_LLM_API_KEY: ${{ secrets.OPENOUTFIND_LLM_API_KEY }}
      OPENOUTFIND_BETTERCONTACT_API_KEY: ${{ secrets.OPENOUTFIND_BETTERCONTACT_API_KEY }}
      GOOGLE_SHEETS_API_URL: ${{ secrets.GOOGLE_SHEETS_API_URL }}
      GOOGLE_SHEETS_API_TOKEN: ${{ secrets.GOOGLE_SHEETS_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore local campaign database
        uses: actions/cache/restore@v4
        with:
          path: .state/openoutfind.sqlite3
          key: openoutfind-db-${{ github.run_id }}
          restore-keys: |
            openoutfind-db-

      - name: Install OpenOutFind
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in OPENOUTFIND_LLM_API_KEY OPENOUTFIND_BETTERCONTACT_API_KEY GOOGLE_SHEETS_API_URL GOOGLE_SHEETS_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          mkdir -p .state

      - name: Find qualified leads (no email enrichment)
        shell: bash
        run: |
          set -euo pipefail
          outfind find "${{ inputs.lead_count }}" --json > leads.jsonl

      - name: Upsert leads into Google Sheets
        run: python scripts/export_to_google_sheets.py leads.jsonl

      - name: Save campaign database for the next manual run
        if: always() && hashFiles('.state/openoutfind.sqlite3') != ''
        uses: actions/cache/save@v4
        with:
          path: .state/openoutfind.sqlite3
          key: openoutfind-db-${{ github.run_id }}

      - name: Upload run output
        if: always() && hashFiles('leads.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: openoutfind-leads-${{ github.run_id }}
          path: leads.jsonl
          if-no-files-found: ignore
          retention-days: 14
